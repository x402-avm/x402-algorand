[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "x402-algorand"
version = "0.2.1"
authors = [
  { name = "AI Economy Team", email = "team@aieconomy.com" },
]
description = "Algorand (AVM) exact payment scheme for the official x402 Python SDK."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["x402", "algorand", "avm", "micropayments", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = [
    "x402>=2.28,<3",
    "py-algorand-sdk>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=5.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/x402-avm/x402-algorand"
Documentation = "https://x402-avm.github.io"
Issues = "https://github.com/x402-avm/x402-algorand/issues"
Changelog = "https://github.com/x402-avm/x402-algorand/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["x402_algorand*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
