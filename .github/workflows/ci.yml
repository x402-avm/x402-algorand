name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Check
        run: ruff check .
      - name: Run Ruff Format Check
        run: ruff format --check .

  test:
    name: Test (offline) - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run offline tests
        run: pytest

  localnet:
    name: LocalNet Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AlgoKit & start LocalNet
        run: |
          pipx install algokit
          algokit localnet start
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:4001/health
      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run LocalNet tests
        run: LOCALNET=1 pytest

  public-networks:
    name: Public Network Simulation Tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run public network tests
        run: PUBLIC_NETS=1 pytest tests/test_public_networks.py

  build:
    name: Build & Package Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      - name: Build distribution
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
